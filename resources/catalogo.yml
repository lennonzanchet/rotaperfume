resources:
  schemas:
    schema_bronze:
      name: bronze
      catalog_name: ${var.catalog}
      comment: Ingestão crua. O dado como veio da origem, sujeira inclusa.
      properties:
        collation: UTF8_BINARY
        owner: root
      lifecycle:
        prevent_destroy: true

    schema_silver:
      name: silver
      catalog_name: ${var.catalog}
      comment: Limpo, deduplicado e tipado. Preenchido na noite 2.
      properties:
        collation: UTF8_BINARY
        owner: root
      lifecycle:
        prevent_destroy: true

    schema_gold:
      name: gold
      catalog_name: ${var.catalog}
      comment: Fatos e dimensões, modelado para consumo. Preenchido na noite 2.
      properties:
        collation: UTF8_BINARY
        owner: root
      lifecycle:
        prevent_destroy: true

  volumes:
    volume_raw:
      name: raw
      catalog_name: ${var.catalog}
      schema_name: bronze
      volume_type: MANAGED
      comment: CSVs originais de ERP e CRM.
      lifecycle:
        prevent_destroy: true
