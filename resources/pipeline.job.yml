resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline

      # Novas tarefas serão acrescentadas a este mesmo pipeline nos próximos prompts da Aula 02.
      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql

        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql

        - task_key: silver_itens_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql

        - task_key: silver_crm_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql

        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_produtos
            - task_key: silver_crm_financeiro
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql

        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql

        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql

        # Segundo ramo após os marts: materializa a interface semântica Gold
        # usada pelo Genie sem alterar a execução independente dos testes.
        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/09-metricas-negocio.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
          sql_task:
            file:
              path: ../src/gold/10-auditoria-metadado.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql

      # A tarefa não declara compute dedicado e, portanto, usa serverless.
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/Sao_Paulo
