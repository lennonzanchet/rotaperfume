resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline

      # Novas tarefas serão acrescentadas a este mesmo pipeline nos próximos prompts da Aula 02.
      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

      # A tarefa não declara compute dedicado e, portanto, usa serverless.
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/Sao_Paulo
