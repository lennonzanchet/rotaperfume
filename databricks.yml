# This is a Declarative Automation Bundle definition for rotaperfume.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: rotaperfume
  uuid: 88f7808e-3bec-43a1-be2e-5862d32429ce

include:
  - resources/*.yml

sync:
  exclude:
    - .agents/**
    - dados/**
    - material/**
    - resources/*.lvdash.json

# Shared variables used by every deployment target.
variables:
  catalog:
    description: The catalog to use
    default: lakehouse_rotaperfume
  warehouse_id:
    description: The SQL warehouse to use
    default: 2f89b2234655e504

targets:
  dev:
    # mode: development is intentionally omitted so Unity Catalog resources keep
    # their exact bronze, silver, and gold names without development prefixes.
    default: true
    workspace:
      host: https://dbc-d6b23734-47be.cloud.databricks.com
    presets:
      trigger_pause_status: PAUSED
  prod:
    mode: production
    workspace:
      host: https://dbc-d6b23734-47be.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/lennonzanchet7@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lennonzanchet7@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: lennonzanchet7@gmail.com
        level: CAN_MANAGE
