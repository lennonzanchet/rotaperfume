# This is a Declarative Automation Bundle definition for rotaperfume.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: rotaperfume
  uuid: 88f7808e-3bec-43a1-be2e-5862d32429ce

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d6b23734-47be.cloud.databricks.com
    variables:
      catalog: lakehouse_rotaperfume
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-d6b23734-47be.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/lennonzanchet7@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lennonzanchet7@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_rotaperfume
      schema: prod
    permissions:
      - user_name: lennonzanchet7@gmail.com
        level: CAN_MANAGE
